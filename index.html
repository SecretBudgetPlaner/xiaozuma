<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<!-- Omslagssida för budgetappen (v2). All logik och data ligger kvar i Apps Script och Google Sheets.
     Sidan minns appkoden åt appen, så att den inte behöver skrivas in igen. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<meta name="theme-color" content="#1a0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="robots" content="noindex, nofollow">
<style>
  html, body { margin: 0; height: 100%; background: #1a0f12; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #laddar {
    position: fixed; inset: 0; z-index: 2; background: #1a0f12; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.2rem; color: #e9dfe1;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 2rem;
  }
  #laddar .ruta { font-size: 2.2rem; color: #c48a97; animation: puls 1.6s ease-in-out infinite; }
  #laddar a { color: #e9dfe1; text-underline-offset: 3px; }
  #laddar small { color: #a8979b; max-width: 30ch; }
  #laddar.borta { display: none; }
  @keyframes puls { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #laddar .ruta { animation: none; } }
</style>
</head>
<body>
  <div id="laddar">
    <div class="ruta" aria-hidden="true">◆</div>
    <div>Öppnar budgeten…</div>
    <small>Laddar den inte? <a href="https://script.google.com/macros/s/AKfycbxGb9a6zEhFJXumW8n66Z-wfPhXOwcGO_qn33p7OoaY3sCMX0l--qPZK3fTxRbx-yoLOQ/exec">Öppna appen direkt</a>.</small>
  </div>
  <iframe
    src="https://script.google.com/macros/s/AKfycbxGb9a6zEhFJXumW8n66Z-wfPhXOwcGO_qn33p7OoaY3sCMX0l--qPZK3fTxRbx-yoLOQ/exec"
    title="Budget" allow="clipboard-write"
    onload="setTimeout(function(){document.getElementById('laddar').classList.add('borta')},400)"></iframe>
<script>
  // Appen (inne i Googles ruta) ber om, sparar och glömmer appkoden här.
  // Svar ges bara till Googles app-domän.
  (function(){
    var NYCKEL = "budget.kod";
    function franAppen(o){ return /^https:\/\/[a-z0-9-]+\.script\.googleusercontent\.com$/.test(o) || /\.googleusercontent\.com$/.test(o); }
    window.addEventListener("message", function(ev){
      if(!franAppen(ev.origin) || !ev.data || typeof ev.data !== "object") return;
      try{
        if(ev.data.budget === "hamtaKod"){
          ev.source.postMessage({ budget: "kod", kod: localStorage.getItem(NYCKEL) || "" }, ev.origin);
        } else if(ev.data.budget === "sparaKod" && typeof ev.data.kod === "string"){
          localStorage.setItem(NYCKEL, ev.data.kod);
        } else if(ev.data.budget === "glomKod"){
          localStorage.removeItem(NYCKEL);
        }
      }catch(e){}
    });
  })();
</script>
</body>
</html>
